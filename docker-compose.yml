# Live-Betrieb. Alle Werte kommen aus der .env in diesem Ordner (Vorlage: .env.example).
# Pflichtwerte (${VAR:?...}) fehlen -> docker compose bricht mit Fehlermeldung ab.

services:
  db:
    # Images per Tag + Digest gepinnt – Updates nur bewusst durch Ändern der Zeile
    image: postgres:16.15-alpine3.24@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    environment:
      POSTGRES_DB: sauna_aufguss
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
      TZ: ${TZ:-Europe/Berlin}
      PGTZ: ${TZ:-Europe/Berlin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # kein Port nach außen – nur intern für das Backend erreichbar
    restart: unless-stopped

  backend:
    # Kontext = Projekt-Root, damit der gemeinsame package-lock.json im Build landet
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/sauna_aufguss
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET fehlt in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD fehlt in .env}
      PORT: 3001
      FRONTEND_URL: https://${DOMAIN}
      TZ: ${TZ:-Europe/Berlin}
      # Backups: Uhrzeit des täglichen Backups (-1 = aus), Aufbewahrung in Tagen
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      # Protokoll: Einträge nach so vielen Tagen löschen (0 = nie)
      AUDIT_LOG_DAYS: ${AUDIT_LOG_DAYS:-365}
    volumes:
      - uploads:/app/backend/uploads
      # Backups zusätzlich direkt auf dem Server unter ./backups (einfach wegkopierbar)
      - ./backups:/app/backend/backups
    # kein Port nach außen – erreichbar nur über nginx (/api, /uploads)
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN fehlt in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot
    depends_on:
      - backend
    restart: unless-stopped

  certbot:
    image: certbot/certbot:v5.9.0@sha256:bc93cb710b413e6b456d622f9b0133b3e109c0a78c2ed9976af43d209b0a1805
    entrypoint: /bin/sh /entrypoint.sh
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN fehlt in .env}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?LETSENCRYPT_EMAIL fehlt in .env}
      LETSENCRYPT_STAGING: ${LETSENCRYPT_STAGING:-0}
    volumes:
      - ./certbot/entrypoint.sh:/entrypoint.sh:ro
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  letsencrypt:
  certbot-www:

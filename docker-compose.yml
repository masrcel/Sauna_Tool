services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sauna_aufguss
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: ${TZ:-Europe/Berlin}
      PGTZ: ${TZ:-Europe/Berlin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/sauna_aufguss
      JWT_SECRET: ${JWT_SECRET:-bitte-aendern-im-produktivbetrieb}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-sauna2024}
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - uploads:/app/uploads
    ports:
      - "3001:3001"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  uploads:

# Wird beim Containerstart per envsubst gerendert (nur ${DOMAIN} wird ersetzt).

# Rate-Limit für den Login: pro IP 10 Anfragen/Minute, kurze Spitzen bis 5 extra erlaubt.
# Ergänzt das Limit im Backend (10 Fehlversuche / 15 Min., siehe backend/src/middleware/rateLimit.ts).
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    server_name ${DOMAIN};

    # Let's Encrypt HTTP-01 Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN};

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @login_limited;

        proxy_pass http://backend:3001/api/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # JSON-Antwort, damit die Login-Seite die Meldung anzeigen kann
    location @login_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"error":"Zu viele Anmeldeversuche. Bitte in einer Minute erneut versuchen."}';
    }

    location /uploads/ {
        proxy_pass http://backend:3001/uploads/;
    }
}

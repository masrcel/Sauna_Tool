# Wird beim Containerstart per envsubst gerendert (nur ${DOMAIN} wird ersetzt).

# Rate-Limit für den Login: pro IP 10 Anfragen/Minute, kurze Spitzen bis 5 extra erlaubt.
# Ergänzt das Limit im Backend (10 Fehlversuche / 15 Min., siehe backend/src/middleware/rateLimit.ts).
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

server {
    listen 80;
    server_name ${DOMAIN};

    # Let's Encrypt HTTP-01 Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN};

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Sicherheits-Header. Achtung: Setzt eine location eigene add_header, erbt sie diese
    # NICHT mehr – dort müssen sie wiederholt werden (siehe @login_limited).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP: Skripte nur vom eigenen Server (kein Inline-JS, kein eval) – entschärft XSS,
    # da eingeschleuster Code weder laden noch Tokens an fremde Server schicken kann.
    # Schriften liegen lokal (keine Google Fonts). Bilder auch von https:// (Logo-Adresse in den Einstellungen darf extern sein).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @login_limited;

        proxy_pass http://backend:3001/api/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backup hochladen (Wiederherstellen/Prüfen): größere Dateien und mehr Zeit erlauben
    location ~ ^/api/backup/(restore|inspect)$ {
        client_max_body_size 200m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # JSON-Antwort, damit die Login-Seite die Meldung anzeigen kann
    location @login_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 429 '{"error":"Zu viele Anmeldeversuche. Bitte in einer Minute erneut versuchen."}';
    }

    location /uploads/ {
        proxy_pass http://backend:3001/uploads/;
    }
}
